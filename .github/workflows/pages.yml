# Builds and tests the portfolio on every push to main.
# Publishing to GitHub Pages only happens when the workflow is run manually
# from the Actions tab with "Publish to GitHub Pages" ticked.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build
        run: bun run build

      - name: Locate the static site
        id: site
        run: |
          echo "HTML files in the build output:"
          find . -name "index.html" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./public/*" | head -20
          dir=""
          for candidate in .output/public dist/client dist; do
            if [ -f "$candidate/index.html" ]; then dir="$candidate"; break; fi
          done
          if [ -z "$dir" ]; then echo "No prerendered index.html found"; exit 1; fi
          echo "Using $dir"
          ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Browser smoke test
        run: |
          mkdir -p /tmp/smoke && cp scripts/smoke-test.mjs /tmp/smoke/
          cd /tmp/smoke && npm init -y >/dev/null && npm install --silent playwright-core@1.48.2
          node /tmp/smoke/smoke-test.mjs "$GITHUB_WORKSPACE/${{ steps.site.outputs.dir }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
